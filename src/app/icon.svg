<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0A0A0A"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="10" stroke="#E8C547" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Sun rays (6 lines) -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="28" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="8" y2="16" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="28" y2="16" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7.5" y1="7.5" x2="10.3" y2="10.3" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21.7" y1="21.7" x2="24.5" y2="24.5" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24.5" y1="7.5" x2="21.7" y2="10.3" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10.3" y1="21.7" x2="7.5" y2="24.5" stroke="#E8C547" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center circle -->
  <circle cx="16" cy="16" r="4" fill="#E8C547"/>
  <!-- Inner dot -->
  <circle cx="16" cy="16" r="1.5" fill="#0A0A0A"/>
</svg>
